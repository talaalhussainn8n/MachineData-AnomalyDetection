services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Lokal_Nur_Zum_Testen_1}"
    ports:
      - "1433:1433"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: MachineMonitor.Api
    depends_on: [ mqtt, sqlserver ]
    environment:
      Monitor__MqttHost: mqtt
      Database__Provider: SqlServer
      ConnectionStrings__Monitor: "Server=sqlserver;Database=MachineMonitor;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Lokal_Nur_Zum_Testen_1};TrustServerCertificate=True"
    ports:
      - "8080:8080"
    restart: on-failure

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: MachineMonitor.Simulator
    depends_on: [ mqtt ]
    environment:
      MQTT_HOST: mqtt
      MACHINES: "3"
    restart: on-failure
